<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت رمزنگاری‌شده</title>
    <style>
        body { font-family: Tahoma; background: #f0f4f8; padding: 40px 20px; }
        .box { max-width: 420px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        h1 { text-align: center; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 13px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .success { background: #dcfce7; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
        .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 8px; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>ساخت اتاق چت</h1>

        <div class="error" id="error-box"></div>

        <label>رمز اتاق (حداقل ۴ کاراکتر)</label>
        <input type="password" id="password" placeholder="مثلاً 1234">
        <button onclick="createRoom()">ساخت اتاق چت</button>

        <div class="success" id="success-box">
            <p><strong>اتاق ساخته شد!</strong></p>
            <p>کد اتاق: <strong id="room-code"></strong></p>
            <p>رمز: <strong id="room-pass"></strong></p>
            <p>
                <a id="chat-link" href="#">کلیک برای ورود به چت</a>
            </p>
            <p style="font-size:13px; color:#666;">این کد و رمز را برای دوستت بفرست</p>
        </div>
    </div>

    <script>
        async function createRoom() {
            const password = document.getElementById("password").value;
            const errorBox = document.getElementById("error-box");
            const successBox = document.getElementById("success-box");

            errorBox.style.display = "none";
            successBox.style.display = "none";

            if (password.length < 4) {
                errorBox.innerText = "رمز باید حداقل ۴ کاراکتر باشد";
                errorBox.style.display = "block";
                return;
            }

            const formData = new FormData();
            formData.append("password", password);

            try {
                const res = await fetch("/api/create-room", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    errorBox.innerText = data.error || "خطا در ساخت اتاق";
                    errorBox.style.display = "block";
                    return;
                }

                document.getElementById("room-code").innerText = data.room_code;
                document.getElementById("room-pass").innerText = data.password;
                document.getElementById("chat-link").href = "/chat/" + data.room_code;
                successBox.style.display = "block";

            } catch (e) {
                errorBox.innerText = "خطا در ارتباط با سرور";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
