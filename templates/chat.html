<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>چت {{ room_code }}</title>
  <style>
    body { font-family: Tahoma, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { margin-bottom: 10px; max-width: 80%; }
    .msg .meta { font-size: 12px; color: #94a3b8; }
    .msg .body { background: #334155; padding: 10px 12px; border-radius: 12px; margin-top: 4px; word-break: break-word; }
    .mine .body { background: #2563eb; }
    form { display: flex; gap: 8px; padding: 12px; background: #1e293b; }
    input[type=text] { flex: 1; padding: 12px; border-radius: 8px; border: none; }
    button { padding: 12px 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
    #gate { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    #gate .box { background: #1e293b; padding: 24px; border-radius: 12px; width: min(360px, 90vw); }
    #gate input { width: 100%; margin: 8px 0; padding: 10px; box-sizing: border-box; border-radius: 8px; border: none; }
    #gate button { width: 100%; margin-top: 8px; }
    .err { color: #f87171; font-size: 13px; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="box">
      <h3>ورود به اتاق {{ room_code }}</h3>
      <p class="err" id="gate-err"></p>
      <input id="g-name" placeholder="نام نمایشی" />
      <input id="g-pass" type="password" placeholder="رمز اتاق (کلید رمزنگاری)" />
      <button type="button" onclick="doJoin()">ورود امن</button>
    </div>
  </div>

  <header>
    <strong>اتاق {{ room_code }}</strong>
    <span id="status">قطع</span>
  </header>
  <div id="messages"></div>
  <form id="send-form" onsubmit="return sendMsg(event)">
    <input type="text" id="text" placeholder="پیام..." autocomplete="off" />
    <button type="submit">ارسال</button>
  </form>

  <script>
    const ROOM = "{{ room_code }}";
    let token = sessionStorage.getItem("token_" + ROOM);
    let password = sessionStorage.getItem("room_password_" + ROOM);
    let sender = sessionStorage.getItem("sender_" + ROOM);
    let cryptoKey = null;
    let ws = null;

    function bufToB64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }
    function b64ToBuf(b64) {
      const s = atob(b64);
      const u = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u.buffer;
    }

    async function deriveKey(pass) {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
      // salt ثابت وابسته به room — برای اتاق‌های واقعی بهتر است salt روی سرور ذخیره شود
      const salt = enc.encode("chatroom-salt-" + ROOM);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(plain) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        cryptoKey,
        new TextEncoder().encode(plain)
      );
      return { encrypted_content: bufToB64(ct), iv: bufToB64(iv) };
    }

    async function decryptText(encrypted_content, iv) {
      try {
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBuf(iv) },
          cryptoKey,
          b64ToBuf(encrypted_content)
        );
        return new TextDecoder().decode(pt);
      } catch {
        return "[رمزگشایی ناموفق — رمز اشتباه؟]";
      }
    }

    function addBubble(who, text, time, mine) {
      const div = document.createElement("div");
      div.className = "msg" + (mine ? " mine" : "");
      div.innerHTML = `<div class="meta">${who} · ${time || ""}</div><div class="body"></div>`;
      div.querySelector(".body").textContent = text;
      document.getElementById("messages").appendChild(div);
      div.scrollIntoView({ behavior: "smooth" });
    }

    async function doJoin() {
      const name = document.getElementById("g-name").value.trim() || "ناشناس";
      const pass = document.getElementById("g-pass").value;
      const err = document.getElementById("gate-err");
      err.textContent = "";
      if (!pass || pass.length < 8) { err.textContent = "رمز حداقل ۸ کاراکتر"; return; }
      const fd = new FormData();
      fd.append("room_code", ROOM);
      fd.append("password", pass);
      fd.append("sender", name);
      const res = await fetch("/api/join-room", { method: "POST", body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { err.textContent = data.detail || "خطا"; return; }
      token = data.access_token;
      password = pass;
      sender = data.sender;
      sessionStorage.setItem("token_" + ROOM, token);
      sessionStorage.setItem("room_password_" + ROOM, password);
      sessionStorage.setItem("sender_" + ROOM, sender);
      await startChat();
    }

    async function loadHistory() {
      const res = await fetch("/api/messages/" + ROOM, {
        headers: { Authorization: "Bearer " + token },
      });
      if (!res.ok) return;
      const data = await res.json();
      for (const m of data.messages) {
        const text = await decryptText(m.encrypted_content, m.iv);
        addBubble(m.sender, text, m.created_at, m.sender === sender);
      }
    }

    function connectWs() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/${ROOM}?token=${encodeURIComponent(token)}`);
      ws.onopen = () => { document.getElementById("status").textContent = "متصل"; };
      ws.onclose = () => { document.getElementById("status").textContent = "قطع"; setTimeout(connectWs, 2000); };
      ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "chat") {
          const text = await decryptText(msg.encrypted_content, msg.iv);
          addBubble(msg.sender, text, msg.time, msg.sender === sender);
        }
      };
    }

    async function startChat() {
      cryptoKey = await deriveKey(password);
      document.getElementById("gate").style.display = "none";
      await loadHistory();
      connectWs();
    }

    async function sendMsg(e) {
      e.preventDefault();
      const input = document.getElementById("text");
      const plain = input.value.trim();
      if (!plain || !ws || ws.readyState !== 1) return;
      const { encrypted_content, iv } = await encryptText(plain);
      ws.send(JSON.stringify({ type: "chat", encrypted_content, iv }));
      input.value = "";
      return false;
    }

    (async function init() {
      if (token && password) {
        document.getElementById("g-name").value = sender || "";
        document.getElementById("g-pass").value = password;
        try { await startChat(); } catch (e) { console.error(e); }
      }
    })();
  </script>
</body>
</html>
