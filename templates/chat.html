<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت ساده</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #f0f4f8; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #1e40af; color: white; padding: 16px; text-align: center; }
        .messages { height: 60vh; overflow-y: auto; padding: 15px; background: #f8fafc; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; background: #e0f2fe; max-width: 80%; }
        .input-area { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; }
        .input-area input { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; }
        .input-area button { padding: 12px 18px; background: #10b981; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>چت ساده (بدون رمزنگاری - فقط برای تست)</h2>
            <div>کد اتاق: {{ room_code }}</div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="پیام بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <script>
        const roomCode = "{{ room_code }}";

        async function loadMessages() {
            const res = await fetch(`/api/messages/${roomCode}`);
            const data = await res.json();
            const container = document.getElementById("messages");
            container.innerHTML = "";

            data.messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = "message";
                div.innerHTML = `<div>${msg.encrypted_content}</div><small>${msg.created_at}</small>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;

            await fetch(`/api/messages/${roomCode}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sender: "user",
                    encrypted_content: text,
                    iv: "test"
                })
            });

            input.value = "";
            loadMessages();
        }

        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
